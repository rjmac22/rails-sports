[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rails-sports"
version = "0.1.0"
description = "Sports analysis, modelling and insight using data and simulation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Robert Maclean" }
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "scipy>=1.14",
  "jupyterlab>=4.2",
  "ipykernel>=6.29"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
